title: PEPEREH
tagline: Think Big
description: >-
  A PEPEREH é uma empresa angolana, sediada em Luanda, que combina tecnologia,
  consultoria, comércio e desenvolvimento de negócios para criar soluções
  práticas e orientadas para resultados.
# Enquanto o domínio pepereh.com não estiver ligado:
url: "https://miltonsilvaesilva.github.io"
baseurl: "/Pepereh"
# Depois de ligar o domínio, trocar por:
# url: "https://pepereh.com"
# baseurl: ""
lang: pt
locale: pt_AO
logo: /assets/icon.png
timezone: Africa/Luanda

permalink: /noticias/:title/

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }

exclude:
  - README.md
  - .claude
  - .pages.yml
  - Gemfile
  - Gemfile.lock
  - vendor
