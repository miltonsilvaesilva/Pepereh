<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b14">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://gc.zgo.at; style-src 'self'; font-src 'self'; img-src 'self' data: https://pepereh.goatcounter.com; connect-src 'self' https://formsubmit.co https://pepereh.goatcounter.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
{% seo %}
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="418x414" href="{{ '/assets/icon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
<link rel="alternate" hreflang="pt" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="en" href="{{ page.url | absolute_url }}?lang=en">
<link rel="preload" href="{{ '/assets/fonts/plus-jakarta-sans-latin-400-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/styles.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "PEPEREH – Comércio e Serviços, Lda.",
  "alternateName": "PEPEREH",
  "slogan": "Think Big",
  "url": "{{ site.url }}",
  "logo": "{{ '/assets/icon.png' | absolute_url }}",
  "email": "{{ site.data.contactos.email }}",
  "foundingDate": "2025",
  "areaServed": "AO",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Bairro Nova Vida, Rua 60, Casa n.º 1633",
    "addressLocality": "Luanda",
    "addressRegion": "Kilamba Kiaxi",
    "addressCountry": "AO"
  },
  "contactPoint": {
    "@type": "ContactPoint",
    "contactType": "customer service",
    "email": "{{ site.data.contactos.email }}",
    {%- if site.data.contactos.whatsapp != "" %}"telephone": "+{{ site.data.contactos.whatsapp }}",{% endif %}
    "availableLanguage": ["Portuguese", "English"]
  },
  "sameAs": [{% assign first = true %}{% for r in site.data.contactos.redes %}{% if r[1] != "" %}{% unless first %}, {% endunless %}"{{ r[1] }}"{% assign first = false %}{% endif %}{% endfor %}]
}
</script>
{%- if site.data.contactos.goatcounter != "" %}
<script data-goatcounter="https://{{ site.data.contactos.goatcounter }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
{%- endif %}
